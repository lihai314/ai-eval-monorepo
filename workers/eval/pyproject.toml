[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-worker"
version = "0.1.0"
description = "Queue-triggered Python eval worker (DeepEval) for the eval-hub platform"
requires-python = ">=3.11"
# Deliberately light core deps: judge is an extra so CI stays fast and keyless.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]
judge = ["deepeval>=2.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
