# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → connect lihai314/ai-eval-monorepo.
# Free instance + pull-pattern: see PLAN.md §0.
#
# Secret handling (settled after two validator rejections): the documented
# pattern for a never-committed secret is `key` + `sync: false` and NOTHING
# else — Render then prompts for the value during Blueprint creation.
# Attempt 1 added `isSecret` (undocumented property → entry looked value-less
# → "must have a key and value"); attempt 2 added `value` (conflicts with
# `sync`). At creation, paste the bearer that equals the GHA secret
# EVAL_WORKER_TOKEN.
#
# PG_DSN stays undeclared: the worker boots in memory demo mode without it.
# Add it in the dashboard as an env var when the Supabase project lands —
# a placeholder string would flip the `if dsn:` branch and break demo mode.

services:
  - type: web
    name: eval-worker
    runtime: python
    plan: free
    rootDir: workers/eval
    buildCommand: python -m pip install -e ".[serve]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DEEPEVAL_ENABLED
        value: "0" # flip to 1 once judge deps + OPENAI_API_KEY are added
      - key: WORKER_TOKEN
        sync: false # prompted at creation; never committed
