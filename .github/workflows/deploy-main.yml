name: Deploy Main

# GitHub Flow: every merge to main is deployed to staging, smoke-tested, then
# promoted to production from the exact same commit. PR previews are provided
# by the Vercel Git integration before merge.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy and Smoke-test Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bind Vercel project (staging)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"ai-eval-staging"}' \
            "${{ secrets.VERCEL_PROJECT_ID_STAGING }}" "${{ vars.VERCEL_ORG_ID }}" \
            > .vercel/project.json

      - name: Deploy
        id: deploy
        run: |
          # Preserve Vercel diagnostics even when the deploy command fails.
          set +e
          npx --yes vercel@64.7.0 deploy --prod --yes \
            --build-env "GIT_SHA=${{ github.sha }}" --build-env GIT_BRANCH=main \
            --token "${{ secrets.VERCEL_TOKEN }}" >vercel-out.log 2>vercel-err.log
          deploy_status=$?
          set -e
          cat vercel-out.log
          cat vercel-err.log >&2
          URL=$(tail -1 vercel-out.log)
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::vercel deploy exited $deploy_status — see build log above"
            exit 1
          fi
          if [[ ! "$URL" =~ vercel\.app$ ]]; then
            echo "::error::unexpected vercel deploy output: [$URL]"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🟡 staging → $URL"

      - name: Smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "## Staging Deploy ✅"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Smoke: passed (version + health verified)"
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy and Smoke-test Production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ai-eval-production-lihai314.vercel.app
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bind Vercel project (production)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"ai-eval-production"}' \
            "${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}" "${{ vars.VERCEL_ORG_ID }}" \
            > .vercel/project.json

      - name: Deploy
        id: deploy
        run: |
          # VERCEL_TOKEN_PROD is scoped to the production Vercel project.
          set +e
          npx --yes vercel@64.7.0 deploy --prod --yes \
            --build-env "GIT_SHA=${{ github.sha }}" --build-env GIT_BRANCH=main \
            --token "${{ secrets.VERCEL_TOKEN_PROD }}" >vercel-out.log 2>vercel-err.log
          deploy_status=$?
          set -e
          cat vercel-out.log
          cat vercel-err.log >&2
          URL=$(tail -1 vercel-out.log)
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::vercel deploy exited $deploy_status — see build log above"
            exit 1
          fi
          if [[ ! "$URL" =~ vercel\.app$ ]]; then
            echo "::error::unexpected vercel deploy output: [$URL]"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🟢 production → $URL"

      - name: Post-deploy Smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "## Production Deploy ✅"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
