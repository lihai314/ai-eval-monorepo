name: Admin — Reconcile Vercel env from GitHub (as-code)

# Admin utility: reconciles both Vercel projects' env vars from
# infra/vercel-env-manifest.json; values come from GitHub secrets/variables
# (or the Supabase Management API for the anon key). Re-run after rotating a
# secret or editing the manifest. REPORT=true lists current env without
# writing. #62

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Only list current env vars, never write"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: staging
            token_secret: VERCEL_TOKEN
            project_id_secret: VERCEL_PROJECT_ID_STAGING
          - project: production
            token_secret: VERCEL_TOKEN_PROD
            project_id_secret: VERCEL_PROJECT_ID_PRODUCTION
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile Vercel env from manifest
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.token_secret] }}
          PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          PROJECT_NAME: ${{ matrix.project }}
          REPORT: ${{ inputs.report }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # manifest value sources (secret:<name> / variable:<name>)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          CORRECTION_SECRET: ${{ secrets.CORRECTION_SECRET }}
        run: node scripts/reconcile-vercel-env.mjs
