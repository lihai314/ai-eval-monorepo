name: Admin — Sync repo secrets to Vercel

# Admin utility: pushes repo secrets (CORRECTION_SECRET, JEV_API_KEY, …) into
# both Vercel projects so deployed BFF routes can read them. Re-run after
# rotating or adding a secret; a secret that is not set on GitHub yet is
# skipped, never clobbered. #62

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Only list current env vars, never write"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: staging
            token_secret: VERCEL_TOKEN
            project_id_secret: VERCEL_PROJECT_ID_STAGING
          - project: production
            token_secret: VERCEL_TOKEN_PROD
            project_id_secret: VERCEL_PROJECT_ID_PRODUCTION
    steps:
      - name: Reconcile secrets on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.token_secret] }}
          PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          REPORT: ${{ inputs.report }}
          CORRECTION_SECRET: ${{ secrets.CORRECTION_SECRET }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          list_envs() {
            curl -s -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}/env"
          }
          if [ "${REPORT}" = "true" ]; then
            echo "${{ matrix.project }} current env (value = first 6 chars):"
            list_envs | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);for(const e of (j.envs||[])){const v=e.value??'';console.log('  '+e.key+' target='+JSON.stringify(e.target)+' type='+e.type+' value='+(v.length>6?v.slice(0,6)+'...':v))}})"
            exit 0
          fi
          for key in CORRECTION_SECRET JEV_API_KEY; do
            value="${!key}"
            if [ -z "${value}" ]; then
              echo "${{ matrix.project }} ${key}: not set on GitHub — skipping"
              continue
            fi
            # Reconcile, don't upsert: POST ?upsert=true does NOT update an
            # existing var (Vercel returns ENV_ALREADY_EXISTS, learned on #62).
            # Find the env id, then PATCH if present, POST if absent.
            existing=$(curl -s -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v9/projects/${PROJECT_ID}/env" |
              node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const e=(j.envs||[]).find(x=>x.key===process.argv[1]);console.log(e?e.id:'')})" "$key")
            if [ -n "$existing" ]; then
              code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X PATCH \
                "https://api.vercel.com/v9/projects/${PROJECT_ID}/env/${existing}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H 'content-type: application/json' \
                -d "{\"value\":\"${value}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}")
            else
              code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
                "https://api.vercel.com/v9/projects/${PROJECT_ID}/env" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H 'content-type: application/json' \
                -d "{\"key\":\"${key}\",\"value\":\"${value}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}")
            fi
            echo "${{ matrix.project }} ${key}: HTTP ${code}"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then cat /tmp/resp.json; exit 1; fi
          done
