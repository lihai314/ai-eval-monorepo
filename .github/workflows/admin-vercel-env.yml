name: Admin — Sync repo secrets to Vercel

# Admin utility: pushes repo secrets (CORRECTION_SECRET, JEV_API_KEY, …) into
# both Vercel projects so deployed BFF routes can read them. Re-run after
# rotating or adding a secret; a secret that is not set on GitHub yet is
# skipped, never clobbered. #62

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: staging
            token_secret: VERCEL_TOKEN
            project_id_secret: VERCEL_PROJECT_ID_STAGING
          - project: production
            token_secret: VERCEL_TOKEN_PROD
            project_id_secret: VERCEL_PROJECT_ID_PRODUCTION
    steps:
      - name: Upsert secrets on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.token_secret] }}
          PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          CORRECTION_SECRET: ${{ secrets.CORRECTION_SECRET }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          set -euo pipefail
          for key in CORRECTION_SECRET JEV_API_KEY; do
            value="${!key}"
            if [ -z "${value}" ]; then
              echo "${{ matrix.project }} ${key}: not set on GitHub — skipping"
              continue
            fi
            code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -X POST "https://api.vercel.com/v9/projects/${PROJECT_ID}/env?upsert=true" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'content-type: application/json' \
              -d "{\"key\":\"${key}\",\"value\":\"${value}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}")
            echo "${{ matrix.project }} ${key}: HTTP ${code}"
            if [ "$code" != "200" ]; then cat /tmp/resp.json; exit 1; fi
          done
