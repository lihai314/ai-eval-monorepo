name: Release Production

# The "Release" gate in the pipeline: only runs when a human triggers it, and
# the job is bound to the `production` GitHub environment. Add required
# reviewers on that environment to make promotion a two-person approval.

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Commit SHA to release (must be the one that passed staging smoke)"
        required: false
        default: ""

concurrency:
  group: deploy-production

jobs:
  production:
    name: Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — release the SHA that passed staging
        if: ${{ github.event.inputs.confirm_sha != '' }}
        run: |
          if [ "${{ github.event.inputs.confirm_sha }}" != "${{ github.sha }}" ]; then
            echo "::error::confirm_sha (${{ github.event.inputs.confirm_sha }}) is not HEAD of main (${{ github.sha }})"
            exit 1
          fi
          echo "🔒 releasing verified commit ${{ github.sha }}"

      - name: Bind Vercel project (production)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"ai-eval-production"}' \
            "${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}" "${{ vars.VERCEL_ORG_ID }}" \
            > .vercel/project.json

      - name: Deploy
        id: deploy
        env:
          GIT_SHA: ${{ github.sha }}
          GIT_BRANCH: main
        run: |
          set -euo pipefail
          URL=$(npx --yes vercel@latest deploy --prod --yes \
            --token "${{ secrets.VERCEL_TOKEN }}" 2>vercel-build.log | tail -1)
          if [[ ! "$URL" =~ vercel\.app$ ]]; then
            cat vercel-build.log
            echo "::error::unexpected vercel deploy output: $URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🟢 production → $URL"

      - name: Post-release Smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "## Release → Production ✅"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
