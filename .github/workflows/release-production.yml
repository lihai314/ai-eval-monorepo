name: Release Production

# The "Release" gate in the pipeline: only runs when a human triggers it, and
# the job is bound to the `production` GitHub environment. Add required
# reviewers on that environment to make promotion a two-person approval.

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Commit SHA to release (must be the one that passed staging smoke)"
        required: true
        type: string

concurrency:
  group: deploy-production

permissions:
  contents: read
  actions: read

jobs:
  production:
    name: Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — release only a staging-verified SHA
        id: guard
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${CONFIRM_SHA:-}" ]; then
            echo "::error::confirm_sha is empty — a release must name a staging-verified commit"
            exit 1
          fi
          if [ "$CONFIRM_SHA" != "$HEAD_SHA" ]; then
            echo "::error::confirm_sha ($CONFIRM_SHA) is not the workflow HEAD ($HEAD_SHA)"
            exit 1
          fi
          MATCHES=$(gh run list --repo "$REPO" --workflow "Deploy Staging" \
            --status success --limit 100 --json headSha,conclusion \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\" and .conclusion == \"success\")] | length")
          if [ "${MATCHES:-0}" -lt 1 ]; then
            echo "::error::no successful Deploy Staging run for $CONFIRM_SHA — refusing to promote"
            exit 1
          fi
          echo "staging-verified SHA $CONFIRM_SHA ($MATCHES successful staging run(s))"
          echo "verified_sha=$CONFIRM_SHA" >> "$GITHUB_OUTPUT"

      - name: Bind Vercel project (production)
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"ai-eval-production"}' \
            "${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}" "${{ vars.VERCEL_ORG_ID }}" \
            > .vercel/project.json

      - name: Deploy
        id: deploy
        run: |
          # GitHub's default bash has -e: a non-zero vercel exit would kill
          # this step *before* the diagnostic cat below. Disable it explicitly.
          set +e
          # VERCEL_TOKEN_PROD: vcp_ tokens are project-scoped; production needs
          # its own (ai-eval-production → Settings → Tokens).
          npx --yes vercel@64.7.0 deploy --prod --yes \
            --build-env "GIT_SHA=${{ github.sha }}" --build-env GIT_BRANCH=main \
            --token "${{ secrets.VERCEL_TOKEN_PROD }}" >vercel-out.log 2>vercel-err.log
          deploy_status=$?
          set -e
          cat vercel-out.log
          cat vercel-err.log >&2
          URL=$(tail -1 vercel-out.log)
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::vercel deploy exited $deploy_status — see build log above"
            exit 1
          fi
          if [[ ! "$URL" =~ vercel\.app$ ]]; then
            echo "::error::unexpected vercel deploy output: [$URL]"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🟢 production → $URL"

      - name: Post-release Smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "## Release → Production ✅"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source SHA | \`${{ steps.guard.outputs.verified_sha }}\` |"
            echo "| Staging evidence | successful \`Deploy Staging\` run for this SHA |"
            echo "| Approval | \`production\` environment gate |"
            echo "| Deployment URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Post-release smoke | passed |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
