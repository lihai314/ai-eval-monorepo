name: Admin — Replay Supabase Auth Config

# Auth-as-code: replays scripts/setup-supabase-auth.sh (idempotent) against
# the hosted project via the Management API. Run after rotation of the
# access token, redirect-allow-list changes, or enabling the GitHub OAuth
# provider (set GH_OAUTH_CLIENT_ID / GH_OAUTH_SECRET repo secrets first).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Replay auth config
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_SECRET: ${{ secrets.GH_OAUTH_SECRET }}
        run: ./scripts/setup-supabase-auth.sh
